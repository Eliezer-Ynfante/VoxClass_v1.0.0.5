services:
  # MOTOR DE IA (Python)
  ia-service:
    build:
      context: ../ai-service
      dockerfile: ../infrastructure/docker/python/Dockerfile
    container_name: vox-ai
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ../ai-service:/app
    networks:
      - vox-network

  # BACKEND & FRONTEND (Laravel)
  app:
    build:
      context: ../backend-laravel
      dockerfile: ../infrastructure/docker/php/Dockerfile
    container_name: vox-laravel
    restart: unless-stopped
    volumes:
      - ../backend-laravel:/var/www
    networks:
      - vox-network
    depends_on:
      - db

  # SERVIDOR WEB (Nginx)
  nginx:
    image: nginx:alpine
    container_name: vox-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../backend-laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vox-network

  # BASE DE DATOS (Postgres)
  db:
    image: postgres:15-alpine
    container_name: vox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vox_db
      POSTGRES_USER: vox_user
      POSTGRES_PASSWORD: vox_password
    volumes:
      - vox-db-data:/var/lib/postgresql/data
    networks:
      - vox-network

networks:
  vox-network:
    driver: bridge

volumes:
  vox-db-data:
